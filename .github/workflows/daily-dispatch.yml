name: Daily Dispatch

# Manual fallback only. Daily sending is triggered by an external cron
# service (cron-job.org) at 07:00 Asia/Shanghai via the GitHub API:
#   POST /repos/Liaochengxin/zotero-arxiv-daily/actions/workflows/main.yml/dispatches
#   body: {"ref":"main"}
# GitHub's built-in schedule was removed because its shared queue delayed
# runs by 4-8.5 hours (observed 2026-11-18..24), pushing emails past noon.
on:
  workflow_dispatch

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger main workflow via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run main.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched main.yml on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
